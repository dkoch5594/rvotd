<!DOCTYPE html>
<html>
<head>
<title>RVOTD</title>
<meta name="source" content="https://github.com/dkoch5594/rvotd">
<meta name="description" content="selects a random Bible verse to share with the world every day">
<meta name="keywords" content="random, daily, Bible, verse">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="rvotd.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Poetsen One" rel="stylesheet">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="MyWebSite" />
<link rel="manifest" href="/site.webmanifest" />
</head>
<body>
    <div class="grid-container">
        <header>
            <p class="support">This is your Random Verse Of The Day:</p>
        </header>
        <div class="content">
            <h1 id="verse">Getting the verse...</h1>
            <h2 id="ref">The Spirit is moving</h2>
            <div class="tr_selector">
                <p class="support toggle">translations</p>
                <div id="tr_drop">
                    <!--build dropdown list here-->
                </div>
            </div>
        </div>
        <div class="footer">
            <p class="support">Share your thoughts... #RVOTD on socials.</p>
        </div>
    </div>
    <script src="rvotd.js"></script>
</body>
</html>
